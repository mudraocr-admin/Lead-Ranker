# Pennant prospect segmentation — configuration.
# Every threshold here is a demo assumption, not a calibrated value.

edgar:
  # SEC requires a descriptive User-Agent with contact info.
  user_agent: "Mudra OCR research siddhu@mudraocr.com"
  max_rps: 8                      # SEC fair-access limit is 10 req/s

npx:
  index_quarter: "2026/QTR3"      # filings made Jul-Sep 2026
  filed_from: "2026-08-01"        # Aug 2026 filings = Jul 2025 - Jun 2026 votes
  filed_to: "2026-08-31"
  max_trusts_per_family: 10          # N-PX filer CIKs per family; all of a trust's filings are read
  max_mb_per_family: 150
  # Board position per item = consensus of what the filers' for/against-management
  # flags imply; below this share of agreement, fall back to the sponsor rule.
  board_consensus: 0.75
  # Trust names matching this are skipped before download (no equity votes).
  skip_name_regex: "(?i)muni|bond|tax[- ]?(free|exempt)|money market|treasur|liquidity|government|cash reserve|income trust|floating rate|credit|target term|high yield|mortgage"

# Answer keys: items where a proxy adviser publicly opposed the board.
adviser_key:
  search_from: "2025-07-01"      # full N-PX year (Jul 2025 - Jun 2026)
  search_to: "2026-07-31"
  forms: ["DEFA14A", "DEFC14A", "DFAN14A"]
  max_docs: 400
  top_items_max: null             # null = keep every matched item (the brief's 25-40 cap dropped)
  director_fuzzy_threshold: 85    # rapidfuzz token_set_ratio

advisers:
  ISS: {queries: ['"Institutional Shareholder Services"', '"ISS"']}
  GL:  {queries: ['"Glass Lewis"', '"Glass, Lewis"']}

scoring:
  mgmt_follower: 0.90             # >=90% of votes with the board, all priority items (checked first)
  mgmt_min_items: 50              # priority items with a known board position needed for that call
  adviser_follower: 0.90          # >=90% agreement with the adviser the family uses
  partial_category: 0.90          # >=90% adviser agreement in one category, mixed in another
  min_items: 10                   # adviser-opposed items needed to call adviser following
  min_category_items: 3           # category rate only counted with >=3 items
  thin_min_items: 3               # below min_items: with >=3 items, a 95% Wilson bound can rule out following;
                                  # with fewer, no following is shown. Both are labelled low confidence.

ai:
  model: "claude-opus-5"
  # Without credentials the pipeline falls back to deterministic rules and
  # marks every such row ai_source="rules".
  enabled: true

# Reference voters: every registered fund (NPORT-P filer) that filed N-PX in the
# window, minus the target families. Never scored; their votes drive the imputation.
universe:
  workers: 6                      # parallel downloads, all within edgar.max_rps

# Imputed ISS / Glass Lewis recommendations: Zytnick (2025), section 4 + appendix B.
impute:
  close_follower: 0.96            # round 1: close followers agree with the seed recs >= 96% ...
  close_min_items: 5              # ... on >= 5 seed items in that board position,
  close_min_opposed: 3            # ... >= 3 of them where the adviser opposed the board
  min_cell_votes: 10              # a follow rate needs >= 10 labelled votes, else the next coarser one
  threshold: 0.90                 # impute FOR at Pr >= 0.90, AGAINST at <= 0.10, else leave blank
  folds: 5                        # validation: hide 1/5 of the quoted recs at a time
  seed: 7
  gate_opposed_accuracy: 0.90     # use imputed recs only if hidden board-opposed recs come back >= 90% right
  audit:                          # set aside quotes the adviser's strict followers contradict:
    follower: 0.80                # strict follower = >= 80% agreement ...
    min_quotes: 15                # ... on >= 15 other board-opposed quotes
    min_followers: 8              # >= 8 strict followers voted on the item ...
    contradict: 0.75              # ... and >= 75% of them voted against the quote
